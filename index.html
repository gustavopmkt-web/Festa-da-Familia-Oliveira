<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130d">
  <title>Festa da Família Oliveira | Contagem Regressiva</title>
  <style>
    :root {
      --paper: #f5ead0;
      --brown: #6f3218;
      --ink: #171a0f;
      --gold: #d3a64a;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #17130d;
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: min(100vw, 1100px);
      min-height: 100svh;
      overflow: hidden;
      background:
        linear-gradient(rgba(15,12,7,.20), rgba(15,12,7,.34)),
        url("arte.png") center center / cover no-repeat;
    }

    .shade {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,.12), transparent 24%, transparent 72%, rgba(0,0,0,.42));
      pointer-events: none;
    }

    .counter {
      position: absolute;
      left: 6%;
      top: 8%;
      width: 44%;
      min-width: 310px;
      text-align: center;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
    }

    .eyebrow {
      margin: 0 0 6px;
      font-size: clamp(18px, 2.6vw, 34px);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .days {
      margin: 0;
      font-size: clamp(110px, 18vw, 235px);
      line-height: .76;
      font-weight: 900;
      color: var(--brown);
      letter-spacing: -.07em;
    }

    .days-label {
      margin-top: 18px;
      font-size: clamp(24px, 4vw, 46px);
      font-weight: 900;
      letter-spacing: .08em;
    }

    .time {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 22px auto 0;
      max-width: 460px;
    }

    .unit {
      background: rgba(245,234,208,.87);
      border: 2px solid rgba(111,50,24,.65);
      border-radius: 8px;
      padding: 9px 5px 7px;
      box-shadow: 0 4px 12px rgba(0,0,0,.16);
      backdrop-filter: blur(2px);
    }

    .num {
      display: block;
      font-family: "Courier New", monospace;
      font-size: clamp(27px, 4vw, 48px);
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
    }

    .label {
      display: block;
      margin-top: 5px;
      font-size: clamp(10px, 1.3vw, 15px);
      font-weight: 900;
      letter-spacing: .08em;
      color: var(--brown);
    }

    .footer {
      position: absolute;
      left: 6%;
      bottom: 5%;
      width: 44%;
      min-width: 310px;
      text-align: center;
      font-size: clamp(15px, 2vw, 24px);
      font-weight: 700;
      letter-spacing: .04em;
      color: var(--paper);
      text-shadow: 0 2px 5px #000;
    }

    .today {
      display: none;
      font-size: clamp(36px, 7vw, 84px);
      font-weight: 900;
      color: var(--brown);
      background: rgba(245,234,208,.92);
      padding: 18px 20px;
      border: 3px solid var(--brown);
      border-radius: 10px;
    }

    @media (max-width: 700px) {
      .page {
        width: 100vw;
        background-position: center center;
      }

      .counter {
        left: 3%;
        top: 6%;
        width: 94%;
        min-width: 0;
      }

      .days {
        font-size: clamp(110px, 36vw, 190px);
      }

      .time {
        max-width: 390px;
        gap: 5px;
        margin-top: 15px;
      }

      .footer {
        left: 5%;
        width: 90%;
        min-width: 0;
        bottom: 3%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shade"></div>

    <section class="counter" aria-live="polite">
      <p class="eyebrow">FALTAM</p>
      <div id="days" class="days">--</div>
      <div id="daysLabel" class="days-label">DIAS</div>

      <div class="time">
        <div class="unit">
          <span id="hours" class="num">00</span>
          <span class="label">HORAS</span>
        </div>
        <div class="unit">
          <span id="minutes" class="num">00</span>
          <span class="label">MINUTOS</span>
        </div>
        <div class="unit">
          <span id="seconds" class="num">00</span>
          <span class="label">SEGUNDOS</span>
        </div>
      </div>

      <div id="today" class="today">É HOJE! 🎉</div>
    </section>

    <div class="footer">
      FESTA DA FAMÍLIA OLIVEIRA<br>
      DOMINGO, 06 DE SETEMBRO
    </div>
  </main>

  <script>
    // Horário oficial adotado: 06/09/2026 às 00:00, horário de Brasília.
    const target = new Date("2026-09-06T00:00:00-03:00").getTime();

    const $ = id => document.getElementById(id);

    function pad(n) {
      return String(n).padStart(2, "0");
    }

    function update() {
      const now = Date.now();
      let diff = target - now;

      if (diff <= 0) {
        $("days").style.display = "none";
        $("daysLabel").style.display = "none";
        document.querySelector(".time").style.display = "none";
        $("today").style.display = "inline-block";
        return;
      }

      const day = 86400000;
      const hour = 3600000;
      const minute = 60000;

      const days = Math.floor(diff / day);
      diff %= day;

      const hours = Math.floor(diff / hour);
      diff %= hour;

      const minutes = Math.floor(diff / minute);
      const seconds = Math.floor((diff % minute) / 1000);

      $("days").textContent = days;
      $("daysLabel").textContent = days === 1 ? "DIA" : "DIAS";
      $("hours").textContent = pad(hours);
      $("minutes").textContent = pad(minutes);
      $("seconds").textContent = pad(seconds);
    }

    update();
    setInterval(update, 1000);
  </script>
</body>
</html>
