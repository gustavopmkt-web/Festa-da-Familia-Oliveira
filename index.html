<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130d">

  <title>Festa da Família Oliveira | Contagem Regressiva</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <style>

    :root {
      --brown: #6f3218;
      --ink: #17130d;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: #17130d;
    }

    body {
      min-height: 100svh;
      width: 100%;
      height: 100svh;
      margin: 0;

  overflow: hidden;
      font-family:
        "Roboto Slab",
        Georgia,
        "Times New Roman",
        serif;
    }


    /* =====================================================
       ESTRUTURA PRINCIPAL
       ===================================================== */

    .page {
      position: relative;
      width: 100%;
      max-width: 100vw;
      height: 100svh;
      margin: 0 auto;
      overflow: hidden;
      
    }

    .poster {
     display: block;

     width: auto;
     height: auto;

     max-width: 100vw;
     max-height: 100svh;

     object-fit: contain;
    }


    /* =====================================================
       CONTADOR
       ===================================================== */

    .counter {
      position: absolute;

      top: 45%;
      left: 50%;

      transform: translateX(-50%);

      width: 100%;

      text-align: center;

      z-index: 2;
     
    }


    /* =====================================================
       NÚMERO DE DIAS
       ===================================================== */

    .days {
      margin: 0;

      font-size: clamp(60px, 7vw, 100px);

      line-height: .78;

      font-weight: 900;

      color: var(--brown);

      letter-spacing: -.075em;

      text-shadow:
        1px 1px 0 rgba(255,255,255,.20),
        0 3px 5px rgba(0,0,0,.10);
    }


    /* =====================================================
       DIAS
       ===================================================== */

    .days-label {
      position: relative;
      left: 10px;
      margin: 12px 0 34px;

      font-size: clamp(
        30px,
        3,2vw,
        35px
      );

      line-height: 1;

      font-weight: 900;

      letter-spacing: .06em;

      color: var(--ink);

      text-shadow:
        0 1px 0 rgba(255,255,255,.35);
    }


    /* =====================================================
       HORAS / MINUTOS / SEGUNDOS
       ===================================================== */

    .time {

      width: min(
        94%,
        720px
      );

      margin: 0 auto;

      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      align-items: start;
      
      transform: translateY(0px);
    }


    .unit {

      position: relative;

      min-width: 0;

      padding: 0 10px;
    }


    .unit + .unit::before {

      content: "";

      position: absolute;

      left: 0;

      top: 8%;

      height: 84%;

      width: 2px;

      background:
        rgba(111,50,24,.65);
    }


    .num {

      display: block;

      font-size: clamp(
        55px,
        8vw,
        88px
      );

      line-height: .9;

      font-weight: 900;

      color: var(--brown);

      letter-spacing: -.04em;
    }


    .label {

      display: block;

      margin-top: 10px;

      font-size: clamp(
        17px,
        2.5vw,
        27px
      );

      line-height: 1;

      font-weight: 900;

      letter-spacing: .025em;

      color: var(--ink);

      white-space: nowrap;
    }


    .today {

      display: none;

      font-size: clamp(
        45px,
        8vw,
        90px
      );

      font-weight: 900;

      color: var(--brown);
    }



    /* =====================================================
       📱 CELULAR / RETRATO
       
       TUDO AQUI É EXCLUSIVO DO CELULAR.
       
       O COMPUTADOR NÃO É AFETADO POR ESTAS REGRAS.
       ===================================================== */

    @media (max-width: 768px) {

      .page {

        width: 100%;

        max-width: none;
      }


      .poster {

        width: 100%;

        height: auto;
      }


      /* POSIÇÃO DO BLOCO INTEIRO NO CELULAR */

      .counter {

        top: 10%;

        width: 15%;
      }


      /* TAMANHO DO 15 NO CELULAR */

      .days {
        clor: red;
        
        font-size: clamp(
          60px,
          10vw,
          90px
        );

        position: relative;

        top: 0;
      }


      /* DIAS NO CELULAR */

      .days-label {

        margin:
          10px
          0
          18px;

        font-size: clamp(
          35px,
          3,2vw,
          35px
        );
      }


      /* HORAS / MINUTOS / SEGUNDOS
         NO CELULAR */

      .time {

        width: 55%;

        position: relative;

        top: 0;
      }


      .unit {

        padding:
          0
          8px;
      }


      .num {

        font-size: clamp(
          20px,
          5vw,
          32px
        );
      }


      .label {

        margin-top: 7px;

        font-size: clamp(
          8px,
          2vw,
          10px
        );


      }


      .unit + .unit::before {

        top: 5%;

        height: 90%;
      }

    }



    /* =====================================================
       💻 COMPUTADOR / PAISAGEM
       
       TUDO AQUI É EXCLUSIVO DO COMPUTADOR.
       
       O CELULAR NÃO É AFETADO POR ESTAS REGRAS.
       ===================================================== */

    @media (min-width: 769px) {
body {
    
}

      /* ESCONDE A ARTE VERTICAL */

      .poster-portrait {

        display: none;
      }


      /* MOSTRA A ARTE HORIZONTAL */

      .poster-landscape {

        display: block;
      }


      /* POSIÇÃO DO CONTADOR NO COMPUTADOR */

      .counter {

        top: 19%;

        width:
          min(
            70%,
            760px
          );
      }


      /* TAMANHO DO 15 NO COMPUTADOR */

      .days {

        font-size: clamp(
          100px,
          20vw,
          80px
        );

        position: relative;

        top: 85px;
      }


      /* DIAS NO COMPUTADOR */

      .days-label {
      position: relative;
      top: 25px;
        margin:
          8px
          0
          40px;

        font-size: 16px;

      
      }


      /* HORAS / MINUTOS / SEGUNDOS
         NO COMPUTADOR */

      .time {

        width:
          min(
            65%,
            480px
          );

        position: relative;

        top: 0px;
      }


      .num {

        font-size: 12px !important;    
        }


      .label {

        font-size: clamp(
          8px,
          1vw,
          13px
        );
      }

    }

  </style>
</head>



<body>

  <main class="page">


    <!-- =================================================
         IMAGENS

         RETRATO  = arte-vertical.png
         PAISAGEM  = arte-horizontal.png
         ================================================= -->

    <picture>

      <source
        media="(orientation: landscape)"
        srcset="arte-horizontal.png"
      >

      <img
        class="poster poster-portrait poster-landscape"
        src="arte-vertical.png"
        alt="Festa da Família Oliveira"
      >

    </picture>



    <!-- =================================================
         CONTADOR
         ================================================= -->

    <section
      class="counter"
      aria-live="polite"
    >


      <!-- NÚMERO DE DIAS -->

      <div
        id="days"
        class="days"
      >
        --
      </div>


      <!-- PALAVRA DIAS -->

      <div
        id="daysLabel"
        class="days-label"
      >
        DIAS
      </div>


      <!-- HORAS / MINUTOS / SEGUNDOS -->

      <div class="time">


        <div class="unit">

          <span
            id="hours"
            class="num"
          >
            00
          </span>

          <span class="label">
            Horas
          </span>

        </div>



        <div class="unit">

          <span
            id="minutes"
            class="num"
          >
            00
          </span>

          <span class="label">
            Minutos
          </span>

        </div>



        <div class="unit">

          <span
            id="seconds"
            class="num"
          >
            00
          </span>

          <span class="label">
            Segundos
          </span>

        </div>


      </div>


      <!-- QUANDO CHEGAR A ZERO -->

      <div
        id="today"
        class="today"
      >
        É HOJE!
      </div>


    </section>

  </main>



  <script>


    /* =====================================================
       DATA DA FESTA

       06/09/2026 às 00:00
       Horário de Brasília
       ===================================================== */

    const target =
      new Date(
        "2026-09-06T00:00:00-03:00"
      ).getTime();



    const $ =
      id =>
        document.getElementById(id);



    function pad(value) {

      return String(value)
        .padStart(2, "0");

    }



    function updateCountdown() {


      let diff =
        target - Date.now();



      /* QUANDO CHEGAR A ZERO */

      if (diff <= 0) {


        $("days").style.display =
          "none";


        $("daysLabel").style.display =
          "none";


        document
          .querySelector(".time")
          .style.display =
          "none";


        $("today").style.display =
          "inline-block";


        return;

      }



      const DAY =
        86400000;


      const HOUR =
        3600000;


      const MINUTE =
        60000;



      const days =
        Math.floor(
          diff / DAY
        );


      diff %= DAY;



      const hours =
        Math.floor(
          diff / HOUR
        );


      diff %= HOUR;



      const minutes =
        Math.floor(
          diff / MINUTE
        );



      const seconds =
        Math.floor(
          (diff % MINUTE) / 1000
        );



      $("days").textContent =
        days;



      $("daysLabel").textContent =
        days === 1
          ? "DIA"
          : "DIAS";



      $("hours").textContent =
        pad(hours);



      $("minutes").textContent =
        pad(minutes);



      $("seconds").textContent =
        pad(seconds);

    }



    /* PRIMEIRA ATUALIZAÇÃO */

    updateCountdown();



    /* ATUALIZA A CADA SEGUNDO */

    setInterval(
      updateCountdown,
      1000
    );


  </script>

</body>
</html>
