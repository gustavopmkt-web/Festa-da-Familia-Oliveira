<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130d">
  <title>Festa da Família Oliveira | Contagem Regressiva</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --brown: #6f3218;
      --ink: #17130d;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: #17130d;
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      font-family: "Roboto Slab", Georgia, "Times New Roman", serif;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100svh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow: hidden;
      background: #17130d;
    }

    /* A imagem inteira fica visível. O navegador escolhe a versão
       de acordo com a orientação da tela. */
    .poster {
      display: block;
      width: 100%;
      height: auto;
      max-width: 1080px;
      object-fit: contain;
    }

    .counter {
      position: absolute;
      top: 29%;
      left: 50%;
      transform: translateX(-50%);
      width: 94%;
      text-align: center;
      z-index: 2;
    }

    .days {
      margin: 0;
      font-size: clamp(190px, 29vw, 330px);
      line-height: .78;
      font-weight: 900;
      color: var(--brown);
      letter-spacing: -.075em;
      text-shadow:
        1px 1px 0 rgba(255,255,255,.20),
        0 3px 5px rgba(0,0,0,.10);
    }

    .days-label {
      margin: 18px 0 34px;
      font-size: clamp(38px, 5vw, 60px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .06em;
      color: var(--ink);
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
    }

    .time {
      width: min(94%, 720px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      align-items: start;
    }

    .unit {
      position: relative;
      min-width: 0;
      padding: 0 18px;
    }

    .unit + .unit::before {
      content: "";
      position: absolute;
      left: 0;
      top: 8%;
      height: 84%;
      width: 2px;
      background: rgba(111,50,24,.65);
    }

    .num {
      display: block;
      font-size: clamp(55px, 8vw, 88px);
      line-height: .9;
      font-weight: 900;
      color: var(--brown);
      letter-spacing: -.04em;
    }

    .label {
      display: block;
      margin-top: 10px;
      font-size: clamp(17px, 2.5vw, 27px);
      line-height: 1;
      font-weight: 900;
      letter-spacing: .025em;
      color: var(--ink);
      white-space: nowrap;
    }

    .today {
      display: none;
      font-size: clamp(45px, 8vw, 90px);
      font-weight: 900;
      color: var(--brown);
    }

    /*
      CELULAR / RETRATO
      arte-vertical.png
    */
    @media (orientation: portrait) {
      .poster {
        width: 100vw;
        max-width: none;
      }

      .counter {
        top: 29%;
        width: 96%;
      }

      .days {
        font-size: clamp(175px, 42vw, 245px);
      }

      .days-label {
        margin: 14px 0 27px;
        font-size: clamp(34px, 9vw, 48px);
      }

      .time {
        width: 96%;
      }

      .unit {
        padding: 0 8px;
      }

      .num {
        font-size: clamp(42px, 11vw, 64px);
      }

      .label {
        margin-top: 7px;
        font-size: clamp(12px, 3.4vw, 17px);
      }

      .unit + .unit::before {
        top: 5%;
        height: 90%;
      }
    }

    /*
      COMPUTADOR / PAISAGEM
      arte-horizontal.png
    */
    @media (orientation: landscape) {
      .poster {
        width: auto;
        height: 100svh;
        max-width: none;
      }

      .counter {
        top: 25%;
        width: min(70vw, 760px);
      }

      .days {
        font-size: clamp(150px, 18vw, 270px);
      }

      .days-label {
        margin: 14px 0 28px;
        font-size: clamp(34px, 4vw, 54px);
      }

      .time {
        width: min(90%, 700px);
      }

      .num {
        font-size: clamp(48px, 5vw, 78px);
      }

      .label {
        font-size: clamp(15px, 1.8vw, 24px);
      }
    }
  </style>
</head>

<body>
  <main class="page">

    <!--
      O navegador escolhe automaticamente:
      retrato  -> arte-vertical.png
      paisagem -> arte-horizontal.png
    -->
    <picture>
      <source media="(orientation: landscape)" srcset="arte-horizontal.png">
      <img
        class="poster"
        src="arte-vertical.png"
        alt="Festa da Família Oliveira">
    </picture>

    <section class="counter" aria-live="polite">
      <div id="days" class="days">--</div>
      <div id="daysLabel" class="days-label">DIAS</div>

      <div class="time">
        <div class="unit">
          <span id="hours" class="num">00</span>
          <span class="label">HORAS</span>
        </div>

        <div class="unit">
          <span id="minutes" class="num">00</span>
          <span class="label">MINUTOS</span>
        </div>

        <div class="unit">
          <span id="seconds" class="num">00</span>
          <span class="label">SEGUNDOS</span>
        </div>
      </div>

      <div id="today" class="today">É HOJE!</div>
    </section>

  </main>

  <script>
    // Festa: 06/09/2026 às 08:00, horário de Brasília.
    const target = new Date("2026-09-06T08:00:00-03:00").getTime();

    const $ = id => document.getElementById(id);

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      let diff = target - Date.now();

      if (diff <= 0) {
        $("days").style.display = "none";
        $("daysLabel").style.display = "none";
        document.querySelector(".time").style.display = "none";
        $("today").style.display = "inline-block";
        return;
      }

      const DAY = 86400000;
      const HOUR = 3600000;
      const MINUTE = 60000;

      const days = Math.floor(diff / DAY);
      diff %= DAY;

      const hours = Math.floor(diff / HOUR);
      diff %= HOUR;

      const minutes = Math.floor(diff / MINUTE);
      const seconds = Math.floor((diff % MINUTE) / 1000);

      $("days").textContent = days;
      $("daysLabel").textContent = days === 1 ? "DIA" : "DIAS";
      $("hours").textContent = pad(hours);
      $("minutes").textContent = pad(minutes);
      $("seconds").textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
